# Lint and format staged files on commit after a one-time `pre-commit install` (per clone; not
# done for you), or check everything with `pre-commit run --all-files`. The web hooks use
# web/node_modules, so run `npm ci` in web/ first.
#
# The formatters fix files in place: re-add the changed files and commit again. CI runs the
# same checks (`ruff format --check`, `npm run format:check`).
repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.17.0 # keep in step with the `lint` extra in pyproject.toml
    hooks:
      - id: ruff-check
      - id: ruff-format

  - repo: local
    hooks:
      - id: eslint
        name: eslint (web)
        language: system
        entry: bash -c 'cd web && exec ./node_modules/.bin/eslint --max-warnings=0 --no-warn-ignored "${@#web/}"' --
        files: ^web/.+\.(js|ts|vue)$
      - id: prettier
        name: prettier (web)
        language: system
        entry: bash -c 'cd web && exec ./node_modules/.bin/prettier --write --ignore-unknown "${@#web/}"' --
        files: ^web/
