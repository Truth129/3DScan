[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "scan3d"
version = "0.3.0.dev0"
description = "Local, AI-assisted CT case-analysis workbench for research use"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.14,<3.15"
dependencies = [
  "fastapi>=0.115,<1", "uvicorn>=0.34,<1", "python-multipart>=0.0.20",
  "numpy>=2,<3", "scipy>=1.15,<2", "nibabel>=5.3,<6", "pydicom>=3,<4", "python-gdcm>=3.2,<4", "highdicom==0.28.2", "pynetdicom>=3.0.4,<4",
  "pynrrd>=1,<2", "vtk>=9.4,<10", "Pillow>=11,<13", "requests>=2.32,<3",
]

[project.optional-dependencies]
# AI segmentation and corrections. Install PyTorch for your hardware first: see docs/INSTALL.md.
ai = ["nnunetv2==2.8.1", "TotalSegmentator==2.18.0", "nnInteractive==2.6.0"]
# SimpleITK checks that model input matches the reader nnU-Net models were trained with.
test = ["pytest>=8,<10", "httpx>=0.28,<1", "SimpleITK>=2.4,<3"]
# Keep in step with the ruff-pre-commit `rev` in .pre-commit-config.yaml.
lint = ["ruff==0.17.0"]

[project.scripts]
scan3d = "scan3d.__main__:main"

[tool.setuptools.packages.find]
include = ["scan3d*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Tests import helpers from scripts/, which the editable install does not expose: it
# packages scan3d only. Without this, a bare `pytest` fails at collection.
pythonpath = ["."]

[tool.ruff]
line-length = 160
target-version = "py312"
# Git worktrees under .claude/ are full copies of this repository.
extend-exclude = [".claude"]

[tool.ruff.lint]
select = [
  "E9",     # syntax and I/O errors
  "F",      # pyflakes: undefined names, unused imports and variables, redefinitions
  "W",      # pycodestyle warnings: trailing whitespace, invalid escape sequences
  "PLE",    # pylint errors: bad format strings, invalid __all__, misplaced await
  "PGH",    # blanket noqa or type: ignore, misspelled mock assertions
  "T10",    # leftover breakpoint() or pdb
  "NPY",    # NumPy 2 removals and deprecated aliases
  "ASYNC",  # blocking calls inside async handlers
]

[tool.ruff.lint.per-file-ignores]
# Tests share fixtures by importing them from sibling modules (from test_ct_multi import api)
# and requesting them as same-named parameters. Pyflakes reports that as an unused import
# (F401) that is later redefined (F811). Moving shared fixtures to tests/conftest.py
# would let this go.
"tests/**" = ["F401", "F811"]

[tool.ruff.format]
# CI and pre-commit enforce this.
quote-style = "double"
indent-style = "space"
line-ending = "lf"
docstring-code-format = true

