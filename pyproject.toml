[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "scan3d"
version = "0.1.0"
description = "Local chest–abdomen CT reconstruction and revisioned anatomical review"
requires-python = ">=3.12,<3.15"
dependencies = [
  "fastapi>=0.115,<1", "uvicorn>=0.34,<1", "python-multipart>=0.0.20",
  "numpy>=2,<3", "scipy>=1.15,<2", "nibabel>=5.3,<6", "pydicom>=3,<4", "python-gdcm>=3.2,<4",
  "pynrrd>=1,<2", "SimpleITK>=2.4,<3", "vtk>=9.4,<10", "Pillow>=11,<13", "requests>=2.32,<3",
]

[project.optional-dependencies]
test = ["pytest>=8,<10", "httpx>=0.28,<1"]
# Keep in step with the ruff-pre-commit `rev` in .pre-commit-config.yaml.
lint = ["ruff==0.17.0"]

[project.scripts]
scan3d = "scan3d.__main__:main"

[tool.setuptools.packages.find]
include = ["scan3d*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
# The code is hand-wrapped at roughly 110-130 columns, with a tail out to ~200. A 160 limit
# keeps the future reformat closest to that shape: narrower re-wraps far more code, and
# wider joins many wrapped lines into very long ones.
line-length = 160
target-version = "py312"
# Agent worktrees under .claude/ are full copies of this repository.
extend-exclude = [".claude"]

[tool.ruff.lint]
# Correctness checks that pass on the current code. Style rules (E4, E7, I, UP, B, ...)
# wait for the one-time reformat commit; see .git-blame-ignore-revs.
select = [
  "E9",     # syntax and I/O errors
  "F",      # pyflakes: undefined names, unused imports and variables, redefinitions
  "W",      # pycodestyle warnings: trailing whitespace, invalid escape sequences
  "PLE",    # pylint errors: bad format strings, invalid __all__, misplaced await
  "PGH",    # blanket noqa or type: ignore, misspelled mock assertions
  "T10",    # leftover breakpoint() or pdb
  "NPY",    # NumPy 2 removals and deprecated aliases
  "ASYNC",  # blocking calls inside async handlers
]

[tool.ruff.lint.per-file-ignores]
# Tests share fixtures by importing them from sibling modules (from test_ct_multi import api)
# and requesting them as same-named parameters. Pyflakes reports that as an unused import
# (F401) that is later redefined (F811). Moving shared fixtures to tests/conftest.py
# would let this go.
"tests/**" = ["F401", "F811"]

[tool.ruff.format]
# Applied in the one-time reformat commit (see .git-blame-ignore-revs); CI and pre-commit enforce it.
quote-style = "double"
indent-style = "space"
line-ending = "lf"
docstring-code-format = true

