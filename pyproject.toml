[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "scan3d"
version = "0.1.0"
description = "Local chest–abdomen CT reconstruction and revisioned anatomical review"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi>=0.115,<1", "uvicorn>=0.34,<1", "python-multipart>=0.0.20",
  "numpy>=2,<3", "scipy>=1.15,<2", "nibabel>=5.3,<6", "pydicom>=3,<4",
  "pynrrd>=1,<2", "SimpleITK>=2.4,<3", "vtk>=9.4,<10", "Pillow>=11,<13",
]

[project.optional-dependencies]
test = ["pytest>=8,<10", "httpx>=0.28,<1"]

[project.scripts]
scan3d = "scan3d.__main__:main"

[tool.setuptools.packages.find]
include = ["scan3d*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

